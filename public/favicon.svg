  <line x1="246" y1="208" x2="246" y2="284" stroke="#d8b4fe" stroke-opacity="0.4" stroke-width="3" />
  <!-- Diffusion (Rose) -->
  <rect x="298" y="218" width="58" height="86" rx="13" fill="#be123c" stroke="#fda4af" stroke-width="4" />
  <!-- 3D Complex / Confidence (Emerald) -->
