  <path d="M162 216 C162 118, 342 118, 342 216" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" stroke-opacity="0.85" fill="none" />
  <polygon points="342,232 329,208 355,208" fill="#f59e0b" />

